name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catch link and feed rot
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the plugin has no runtime or test dependencies.
      - run: node --test

  links:
    # Network-dependent, so it runs on a schedule and on demand rather than
    # blocking a commit on somebody else's outage.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Name the file explicitly: the default prefers an installed deck, which
      # is the wrong target when the point is to check what this repo ships.
      - run: node bin/checklinks.js data/deck.sample.json
      - run: node bin/checkfeeds.js
      # Fails only on a retraction or expression of concern. Errata and stale
      # claims are reported without failing, since neither means the finding
      # stopped holding.
      - run: node bin/checkclaims.js
